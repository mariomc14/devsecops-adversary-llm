attack:
  name: EC2 enumeration / IMDS configuration discovery
  ttp: T1580 Cloud Infrastructure Discovery
  action: ec2:DescribeInstances
  description: Use valid scoped AWS credentials to call DescribeInstances and identify
    the target EC2 instance and its metadata-service configuration.
defense:
  name: IAM Enumeration Restrictions (Node 1.1)
  classification: Preventive
  description: Use IAM least privilege / explicit deny-style guardrails to prevent
    an unauthorized experimental principal from calling ec2:DescribeInstances.
probe:
  question: Do the preventive IAM restrictions block unauthorized EC2 enumeration?
  expected_evidence: The real DescribeInstances request made with the attempt-owned
    unauthorized principal is denied with verifiable AWS API evidence; the task does
    not require success of the detective/reactive probes.
