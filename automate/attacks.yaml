  id: aws-ec2-modify-imds-options-001
  name: IMDS Protection Weakening via ec2:ModifyInstanceMetadataOptions
  overview: |
    An attacker with the ec2:ModifyInstanceMetadataOptions permission can downgrade or
    weaken the Instance Metadata Service (IMDS) security posture on a target EC2 instance.
    The primary attack vectors are:
    (1) Forcing IMDSv1 by setting HttpTokens to "optional", removing the requirement for
    a signed token and allowing unauthenticated metadata requests.
    (2) Increasing HttpPutResponseHopLimit beyond 1 (e.g., to 2 or higher), which extends
    the TTL of IMDS responses so they can traverse additional network hops. This makes the
    169.254.169.254 metadata endpoint reachable from within containers or other processes
    sharing the host network, enabling theft of temporary IAM credentials attached to the
    instance role. Once IMDS protections are weakened, any process or container on the
    instance (or an attacker exploiting SSRF) can retrieve the IAM role credentials
    without needing IMDSv2 session tokens.
  steps:
    - title: "Step 1: Weaken IMDS Protections on Target EC2 Instance"
